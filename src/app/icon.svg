<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Grand Tulip favicon: the brass hotel key tag from the header, carrying a tulip in pine -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c66e"/>
      <stop offset="1" stop-color="#e3a32c"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#brass)" stroke="#c98a1b" stroke-opacity="0.7" stroke-width="2"/>
  <!-- inner highlight rim -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1"/>
  <!-- punched hole -->
  <circle cx="49" cy="15" r="4" fill="#f7f6f2" stroke="#c98a1b" stroke-width="1.5"/>
  <!-- tulip -->
  <g fill="#16302b">
    <path d="M19 24c0-7 4-11 8-8 2 1.6 3.5 4 5 7 1.5-3 3-5.4 5-7 4-3 8 1 8 8 0 10-5.5 17-13 17S19 34 19 24Z"/>
    <path d="M30.6 41h2.8v13h-2.8z"/>
    <path d="M31 50c-4-4-10-5-14-2 3 4 9 5 14 2Z"/>
  </g>
  <!-- petal split lines in brass so the bloom reads as three petals -->
  <path d="M26.5 19.5 32 29.5 37.5 19.5" fill="none" stroke="#e3a32c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
